name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1'
            os: ubuntu-latest
            arch: x64
# # See https://github.com/jump-dev/SumOfSquares.jl/pull/331
#          - version: 'nightly'
#            os: ubuntu-latest
#            arch: x86
#          - version: 'nightly'
#            os: ubuntu-latest
#            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Install SemialgebraicSets main on Julia 1.10
        if: matrix.version == '1.10'
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.add(url="https://github.com/JuliaAlgebra/SemialgebraicSets.jl", rev="main")
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
# # See https://github.com/oxfordcontrol/Clarabel.jl/pull/230
#        with:
#          depwarn: error
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
